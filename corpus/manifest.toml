# Public naval maintenance / in-service support corpus.
#
# Every entry is a public, unclassified document. `fetch = "auto"` entries are
# downloaded by `python -m ilsrag fetch`. `fetch = "manual"` entries sit behind
# terms-and-conditions pages or download forms: download them yourself and drop
# the file at data/raw/<id>.<format>, then run `ingest`.
#
# issuer drives the agent's provenance rule: it must never present a USN or
# NATO practice as RCN/DND policy.
#
# Removed Oct 2026: NAVSEAINST 4790.26A, 4790.27B and 4790.30. navsea.navy.mil
# no longer serves them; their old URLs now redirect to COMNAVAIRFORINST
# 4790.2E (the 1,930-page Naval Aviation Maintenance Program), which is an
# aviation document and would be indexed under the wrong name. MIL-STD-3034A
# covers the USN ship RCM process those instructions implemented.

